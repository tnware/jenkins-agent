name: Build Test

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: test-image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          echo "Testing built image..."
          docker run --rm --entrypoint /bin/bash test-image:latest -c " \
            docker --version && \
            python3 --version && \
            node --version && \
            npm --version && \
            kubectl version --client && \
            helm version && \
            nc -h && \
            yq --version && \
            envsubst --version && \
            go version"
          echo "All tests passed!"

