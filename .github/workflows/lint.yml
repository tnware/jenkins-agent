name: Lint Dockerfile

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          config-file: .hadolint.yaml
          format: tty

