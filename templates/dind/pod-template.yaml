apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: agent
spec:
  # Optional: Only needed if you require specific permissions (e.g., private registry access)
  # serviceAccountName: jenkins-agent
  containers:
    # Main Jenkins agent container
    - name: jnlp
      image: ghcr.io/tnware/jenkins-agent:v0.1.6
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: "1Gi"
          cpu: "2000m"
        limits:
          memory: "4Gi"
          cpu: "4000m"
      volumeMounts:
        - name: workspace-volume
          mountPath: /home/jenkins/workspace
        - name: docker-sock
          mountPath: /var/run/dind
      env:
        - name: DOCKER_HOST
          value: unix:///var/run/dind/docker.sock
        # Make NVM available in the container
        - name: NVM_DIR
          value: /home/jenkins/.nvm
      tty: true

    # Docker-in-Docker (DinD) sidecar - provides Docker daemon
    - name: docker-daemon
      image: docker:dind
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
      resources:
        requests:
          memory: "512Mi"
          cpu: "2000m"
        limits:
          memory: "2Gi"
          cpu: "4000m"
      # Explicitly configure dockerd to listen on the shared socket and TCP
      args: ["--host=unix:///var/run/dind/docker.sock", "--host=tcp://0.0.0.0:2375", "--storage-driver=overlay2"]
      lifecycle:
        postStart:
          exec:
            command: ["/bin/sh", "-c", "while [ ! -S /var/run/dind/docker.sock ]; do sleep 1; done; chmod 666 /var/run/dind/docker.sock"]
      volumeMounts:
        - name: docker-sock
          mountPath: /var/run/dind
        - name: docker-storage
          mountPath: /var/lib/docker
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
        - name: DOCKER_HOST
          value: unix:///var/run/dind/docker.sock

  volumes:
    - name: workspace-volume
      emptyDir: {}
    - name: docker-sock
      emptyDir: {}
    - name: docker-storage
      emptyDir: {}
