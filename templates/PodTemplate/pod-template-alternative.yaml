apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: agent
spec:
  # Optional: Only needed if you require specific permissions (e.g., private registry access)
  # serviceAccountName: jenkins-agent
  containers:
    # Main Jenkins agent container
    - name: jnlp
      image: ghcr.io/tnware/jenkins-agent:v0.1.6
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "4Gi"
          cpu: "2000m"
      volumeMounts:
        - name: workspace-volume
          mountPath: /home/jenkins/workspace
        - name: docker-sock
          mountPath: /var/run/dind
      env:
        - name: DOCKER_HOST
          value: unix:///var/run/dind/docker.sock
        # Make NVM available in the container
        - name: NVM_DIR
          value: /home/jenkins/.nvm
        # PostgreSQL connection (via sidecar)
        - name: POSTGRES_HOST
          value: localhost
        - name: POSTGRES_PORT
          value: "5432"
        # Redis connection (via sidecar)
        - name: REDIS_HOST
          value: localhost
        - name: REDIS_PORT
          value: "6379"
      tty: true

    # Docker-in-Docker (DinD) sidecar - provides Docker daemon
    - name: docker-daemon
      image: docker:dind
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "2Gi"
          cpu: "1000m"
      # Explicitly configure dockerd to listen on the shared socket and TCP
      # Note: Using vfs storage driver for NFS compatibility (overlay2 doesn't work with NFS)
      args: ["--host=unix:///var/run/dind/docker.sock", "--host=tcp://0.0.0.0:2375", "--storage-driver=vfs"]
      lifecycle:
        postStart:
          exec:
            command: ["/bin/sh", "-c", "while [ ! -S /var/run/dind/docker.sock ]; do sleep 1; done; chmod 666 /var/run/dind/docker.sock"]
      volumeMounts:
        - name: docker-sock
          mountPath: /var/run/dind
        - name: docker-storage
          mountPath: /var/lib/docker
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
        - name: DOCKER_HOST
          value: unix:///var/run/dind/docker.sock

    # PostgreSQL sidecar (alternative to docker run)
    - name: postgres
      image: postgres:14
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: password
        - name: POSTGRES_DB
          value: django
      ports:
        - containerPort: 5432
          name: postgres

    # Redis sidecar (alternative to docker run)
    - name: redis
      image: redis:latest
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "256Mi"
          cpu: "200m"
      ports:
        - containerPort: 6379
          name: redis

  volumes:
    - name: workspace-volume
      emptyDir: {}
    - name: docker-sock
      emptyDir: {}
    - name: docker-storage
      emptyDir: {}
